<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDF Studio — sign in</title><link rel="icon" href="/static/favicon.svg">
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#16181d;font-family:Inter,system-ui,-apple-system,sans-serif;color:#16181d}
form{background:#fff;padding:32px 30px;border-radius:14px;width:min(360px,90vw);box-shadow:0 30px 80px rgba(0,0,0,.4)}
h1{font-size:20px;margin:12px 0 4px}p{color:#6b7080;margin:0 0 18px;font-size:14px}
input{width:100%;box-sizing:border-box;padding:11px 12px;border:1px solid #d9dce3;border-radius:8px;font-size:15px}
button{margin-top:14px;width:100%;padding:11px;border:0;border-radius:8px;background:#e2512f;color:#fff;font-weight:700;font-size:15px;cursor:pointer}
.bad{color:#b42318;font-size:13px;margin-top:10px;display:none}
</style></head><body>
<form method="post" action="/api/login"><img src="/static/favicon.svg" width="44" alt="">
<h1>PDF Studio</h1><p>Enter the password set on your server.</p>
<input type="password" name="password" placeholder="Password" autofocus required>
<button>Sign in</button><div class="bad" id="bad">Wrong password — try again.</div></form>
<script>if(location.search.includes('bad'))document.getElementById('bad').style.display='block'</script>
</body></html>
