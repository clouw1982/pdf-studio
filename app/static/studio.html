<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image Studio — PDF Studio</title>
<link rel="icon" href="/static/favicon.svg">
<link rel="stylesheet" href="/static/studio.css">
</head>
<body>
<header id="bar">
  <a class="brand" href="/" title="Back to PDF Studio"><img src="/static/favicon.svg" alt=""><span>Image Studio</span></a>
  <nav id="menus">
    <div class="m"><button>File</button><div class="dd">
      <button data-cmd="new">New…<kbd>Ctrl N</kbd></button>
      <button data-cmd="open">Open project…<kbd>Ctrl O</kbd></button>
      <button data-cmd="importFile">Open image / PSD / PDF…</button>
      <button data-cmd="importLayer">Place image as layer…</button>
      <hr>
      <button data-cmd="save">Save<kbd>Ctrl S</kbd></button>
      <button data-cmd="saveCopy">Save a copy</button>
      <hr>
      <button data-cmd="placeReplace" class="src-only">Save back to PDF page</button>
      <button data-cmd="placeInsert" class="src-only">Insert as new page after</button>
      <button data-cmd="placeNew">Export as new PDF</button>
      <hr>
      <button data-cmd="exportPNG">Export PNG</button>
      <button data-cmd="exportJPG">Export JPEG</button>
      <button data-cmd="exportWEBP">Export WebP</button>
      <button data-cmd="exportPSD">Export Photoshop PSD</button>
    </div></div>
    <div class="m"><button>Edit</button><div class="dd">
      <button data-cmd="undo">Undo<kbd>Ctrl Z</kbd></button>
      <button data-cmd="redo">Redo<kbd>Ctrl ⇧ Z</kbd></button>
      <hr>
      <button data-cmd="copyLayerSel">Copy selection to new layer<kbd>Ctrl J</kbd></button>
      <button data-cmd="clearSel">Clear selection area<kbd>Del</kbd></button>
      <button data-cmd="fillSel">Fill with foreground<kbd>Alt ⌫</kbd></button>
      <hr>
      <button data-cmd="selectAll">Select all<kbd>Ctrl A</kbd></button>
      <button data-cmd="deselect">Deselect<kbd>Ctrl D</kbd></button>
      <button data-cmd="invertSel">Invert selection<kbd>Ctrl ⇧ I</kbd></button>
    </div></div>
    <div class="m"><button>Image</button><div class="dd">
      <button data-cmd="canvasSize">Canvas size…</button>
      <button data-cmd="imageSize">Image size…</button>
      <button data-cmd="cropToSel">Crop to selection</button>
      <button data-cmd="trim">Trim transparent edges</button>
      <hr>
      <button data-cmd="rotCW">Rotate 90° clockwise</button>
      <button data-cmd="rotCCW">Rotate 90° counter-clockwise</button>
      <button data-cmd="flipCanvasH">Flip canvas horizontal</button>
      <button data-cmd="flipCanvasV">Flip canvas vertical</button>
    </div></div>
    <div class="m"><button>Layer</button><div class="dd">
      <button data-cmd="newLayer">New layer<kbd>Ctrl ⇧ N</kbd></button>
      <button data-cmd="dupLayer">Duplicate layer</button>
      <button data-cmd="delLayer">Delete layer</button>
      <hr>
      <button data-cmd="mergeDown">Merge down<kbd>Ctrl E</kbd></button>
      <button data-cmd="mergeVisible">Merge visible</button>
      <button data-cmd="flatten">Flatten image</button>
      <button data-cmd="rasterize">Rasterize text layer</button>
      <hr>
      <button data-cmd="flipLayerH">Flip layer horizontal</button>
      <button data-cmd="flipLayerV">Flip layer vertical</button>
      <button data-cmd="rotLayer">Rotate layer…</button>
      <button data-cmd="layerUp">Bring forward<kbd>Ctrl ]</kbd></button>
      <button data-cmd="layerDown">Send backward<kbd>Ctrl [</kbd></button>
    </div></div>
    <div class="m"><button>Adjust</button><div class="dd">
      <button data-cmd="adj:brightness">Brightness / Contrast…</button>
      <button data-cmd="adj:hsl">Hue / Saturation…</button>
      <button data-cmd="adj:levels">Levels…</button>
      <button data-cmd="adj:temperature">Temperature / Tint…</button>
      <button data-cmd="adj:exposure">Exposure / Vibrance…</button>
      <button data-cmd="adj:threshold">Threshold…</button>
      <button data-cmd="adj:posterize">Posterize…</button>
      <hr>
      <button data-cmd="adj:invert">Invert</button>
      <button data-cmd="adj:grayscale">Black & white</button>
      <button data-cmd="adj:sepia">Sepia</button>
      <button data-cmd="adj:autolevels">Auto levels</button>
    </div></div>
    <div class="m"><button>Filter</button><div class="dd">
      <button data-cmd="adj:blur">Gaussian blur…</button>
      <button data-cmd="adj:sharpen">Sharpen (unsharp mask)…</button>
      <button data-cmd="adj:noise">Add noise…</button>
      <button data-cmd="adj:pixelate">Pixelate…</button>
      <button data-cmd="adj:vignette">Vignette…</button>
      <hr>
      <button data-cmd="removeBg">✨ Remove background (AI)</button>
    </div></div>
    <div class="m"><button>View</button><div class="dd">
      <button data-cmd="zoomIn">Zoom in<kbd>Ctrl +</kbd></button>
      <button data-cmd="zoomOut">Zoom out<kbd>Ctrl −</kbd></button>
      <button data-cmd="zoomFit">Fit on screen<kbd>Ctrl 0</kbd></button>
      <button data-cmd="zoom100">Actual pixels<kbd>Ctrl 1</kbd></button>
    </div></div>
  </nav>
  <div id="title" title="Click to rename">Untitled</div>
  <span id="dirty"></span>
  <div class="grow"></div>
  <button class="b" id="btnUndo" title="Undo">↶</button>
  <button class="b" id="btnRedo" title="Redo">↷</button>
  <span id="zoomLbl">100%</span>
  <button class="b primary" id="btnSave">Save</button>
  <button class="b accent src-only" id="btnPlace" title="Write this image back into the PDF page it came from">Save to PDF</button>
</header>

<div id="opts"></div>

<main>
  <aside id="tools">
    <button data-tool="move" title="Move & transform (V)">✥</button>
    <button data-tool="marquee" title="Rectangle select (M)">⬚</button>
    <button data-tool="ellipseSel" title="Ellipse select">◌</button>
    <button data-tool="lasso" title="Lasso select (L)">➰</button>
    <button data-tool="crop" title="Crop (C)">⌗</button>
    <hr>
    <button data-tool="brush" title="Brush (B)">🖌</button>
    <button data-tool="pencil" title="Pencil (N)">✏</button>
    <button data-tool="eraser" title="Eraser (E)">⌫</button>
    <button data-tool="fill" title="Paint bucket (G)">◧</button>
    <button data-tool="gradient" title="Gradient">▤</button>
    <button data-tool="clone" title="Clone stamp (S) — Alt-click to set source">⎘</button>
    <hr>
    <button data-tool="text" title="Text (T)">T</button>
    <button data-tool="shape" title="Shape (U)">▭</button>
    <button data-tool="eyedropper" title="Eyedropper (I)">⦿</button>
    <hr>
    <button data-tool="hand" title="Hand (H / hold Space)">✋</button>
    <button data-tool="zoom" title="Zoom (Z) — Alt-click to zoom out">🔍</button>
    <div class="swatches">
      <input type="color" id="fg" value="#1b1d23" title="Foreground colour">
      <input type="color" id="bg" value="#ffffff" title="Background colour">
      <button id="swap" title="Swap colours (X)">⇆</button>
      <button id="resetC" title="Default colours (D)">◩</button>
    </div>
  </aside>

  <section id="stage">
    <canvas id="view"></canvas>
    <div id="overlay"></div>
    <div id="hint"></div>
  </section>

  <aside id="panels">
    <div class="panel" id="propsPanel">
      <h4>Properties</h4>
      <div id="props"></div>
    </div>
    <div class="panel grow">
      <h4>Layers</h4>
      <div class="lrow">
        <select id="lBlend" title="Blend mode">
          <option value="source-over">Normal</option><option value="multiply">Multiply</option><option value="screen">Screen</option>
          <option value="overlay">Overlay</option><option value="darken">Darken</option><option value="lighten">Lighten</option>
          <option value="color-dodge">Color dodge</option><option value="color-burn">Color burn</option><option value="hard-light">Hard light</option>
          <option value="soft-light">Soft light</option><option value="difference">Difference</option><option value="exclusion">Exclusion</option>
          <option value="hue">Hue</option><option value="saturation">Saturation</option><option value="color">Color</option><option value="luminosity">Luminosity</option>
        </select>
        <label class="op">Opacity <input type="range" id="lOpacity" min="0" max="100" value="100"><span id="lOpVal">100%</span></label>
      </div>
      <ul id="layers"></ul>
      <div class="lbtns">
        <button data-cmd="newLayer" title="New layer">＋</button>
        <button data-cmd="dupLayer" title="Duplicate">⧉</button>
        <button data-cmd="mergeDown" title="Merge down">⤓</button>
        <button data-cmd="removeBg" title="Remove background (AI)">✨</button>
        <button data-cmd="delLayer" title="Delete layer">🗑</button>
      </div>
    </div>
    <div class="panel" id="histPanel">
      <h4>History</h4>
      <ul id="history"></ul>
    </div>
  </aside>
</main>

<div id="toasts"></div>
<div id="modal" class="hidden"><div class="box"><h3 id="mTitle"></h3><div id="mBody"></div><div class="row end" id="mBtns"></div></div></div>
<input type="file" id="fileIn" hidden>
<script src="/static/studio.js"></script>
</body>
</html>
